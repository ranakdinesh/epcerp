name: epcerp-local

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5439:5432"
    environment:
      POSTGRES_USER: epcerp
      POSTGRES_DB: epcerp
      POSTGRES_PASSWORD: ${EPCERP_DB_PASSWORD:?Run setup.sh first}
    networks: [default, reading_internal]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U epcerp -d epcerp']
      interval: 5s
      timeout: 5s
      retries: 30

  storage:
    image: epcerp-storage:local
    build:
      # Storage is built entirely from this deployment directory.
      context: .
      dockerfile: storage.Dockerfile
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: epcerp_storage
      MINIO_ROOT_PASSWORD: ${EPCERP_STORAGE_SECRET:?Run setup.sh first}
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - storage_data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 15

  clamav:
    image: clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    # This pinned scanner image is amd64-only; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    networks: [default, reading_internal]
    mem_limit: 4g
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 15

  schema:
    image: epcerp-frontend:local
    command: [node, /app/tools/migrate.mjs, up]
    restart: "no"
    environment:
      EPCERP_DATABASE_URL: postgresql://epcerp:${EPCERP_DB_PASSWORD:?Run setup.sh first}@db:5432/epcerp
      EPCERP_MIGRATION_ROOT: /app/migrations
    depends_on:
      db:
        condition: service_healthy

  document-processor:
    image: epcerp-document-processor:local
    build:
      context: ../../frontend
      dockerfile: ../deployment/epcerp/processor.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    networks: [reading_internal]
    environment:
      EPCERP_DOCUMENT_READING_KEY: ${EPCERP_DOCUMENT_READING_KEY:?Run setup.sh first}
      EPCERP_CLAMD_SOCKET: tcp://clamav:3310
    tmpfs:
      - /tmp:size=768m,uid=10001,gid=10001,mode=0700
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8082/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15

  frontend:
    networks: [default, reading_internal]
    volumes:
      - document_packages_data:/var/lib/epcerp/document-packages
    image: epcerp-frontend:local
    build:
      context: ../../frontend
      dockerfile: ../deployment/epcerp/frontend.Dockerfile
    restart: unless-stopped
    environment:
      EPCERP_API_URL: http://127.0.0.1:1/api/v1
      EPCERP_GO_DISABLED: "true"
      EPCERP_PLATFORM_OWNER: nextjs
      EPCERP_ENVIRONMENT: development
      EPCERP_DEVELOPMENT_HTTP: "true"
      EPCERP_PROJECT_BUDGETS_OWNER: ${EPCERP_PROJECT_BUDGETS_OWNER:-nextjs}
      EPCERP_PURCHASING_OWNER: ${EPCERP_PURCHASING_OWNER:-nextjs}
      EPCERP_PROJECT_TEAM_OWNER: ${EPCERP_PROJECT_TEAM_OWNER:-nextjs}
      EPCERP_PROJECTS_OWNER: ${EPCERP_PROJECTS_OWNER:-nextjs}
      EPCERP_PERSONAL_TASKS_OWNER: ${EPCERP_PERSONAL_TASKS_OWNER:-nextjs}
      EPCERP_INBOX_OWNER: ${EPCERP_INBOX_OWNER:-nextjs}
      EPCERP_TENDER_REGISTER_OWNER: ${EPCERP_TENDER_REGISTER_OWNER:-nextjs}
      EPCERP_TENDER_MANAGER_BUNDLE_IDS: ${EPCERP_TENDER_MANAGER_BUNDLE_IDS:-}
      EPCERP_TENDER_INTAKE_OWNER: ${EPCERP_TENDER_INTAKE_OWNER:-nextjs}
      EPCERP_TSC_OWNER: ${EPCERP_TSC_OWNER:-nextjs}
      EPCERP_DOCUMENT_READING_KEY: ${EPCERP_DOCUMENT_READING_KEY:?Run setup.sh first}
      EPCERP_TSC_CLOUD_APPROVED: ${EPCERP_TSC_CLOUD_APPROVED:-false}
      EPCERP_TSC_GEMINI_API_KEY: ${EPCERP_TSC_GEMINI_API_KEY:-}
      EPCERP_TSC_OPENAI_API_KEY: ${EPCERP_TSC_OPENAI_API_KEY:-}
      EPCERP_TSC_DEEPSEEK_API_KEY: ${EPCERP_TSC_DEEPSEEK_API_KEY:-}
      EPCERP_TSC_GROQ_API_KEY: ${EPCERP_TSC_GROQ_API_KEY:-}
      EPCERP_DOCUMENT_PACKAGE_ROOT: /var/lib/epcerp/document-packages
      EPCERP_TENDER_FORMAT_RENDER_URL: http://document-processor:8082
      EPCERP_TSC_GEMINI_TIER: ${EPCERP_TSC_GEMINI_TIER:-paid}
      EPCERP_TSC_GEMINI_QUESTION_BATCH_SIZE: ${EPCERP_TSC_GEMINI_QUESTION_BATCH_SIZE:-64}
      EPCERP_TSC_GEMINI_QUALITY_MODEL: ${EPCERP_TSC_GEMINI_QUALITY_MODEL:-gemini-3.8-flash}
      EPCERP_TSC_GEMINI_QUALITY_INPUT: ${EPCERP_TSC_GEMINI_QUALITY_INPUT:-indexed}
      EPCERP_TSC_GEMINI_INPUT_TOKEN_LIMIT: ${EPCERP_TSC_GEMINI_INPUT_TOKEN_LIMIT:-240000}
      EPCERP_TSC_USD_INR: ${EPCERP_TSC_USD_INR:-95}
      EPCERP_TSC_FX_DATE: ${EPCERP_TSC_FX_DATE:-2026-11-04}
      EPCERP_TSC_TENDER_LIMIT_PAISE: ${EPCERP_TSC_TENDER_LIMIT_PAISE:-10000}
      EPCERP_TSC_DAILY_LIMIT_PAISE: ${EPCERP_TSC_DAILY_LIMIT_PAISE:-50000}
      EPCERP_AUTH_OWNER: ${EPCERP_AUTH_OWNER:-nextjs}
      EPCERP_CLIENTS_OWNER: ${EPCERP_CLIENTS_OWNER:-nextjs}
      EPCERP_REFERENCES_OWNER: ${EPCERP_REFERENCES_OWNER:-nextjs}
      EPCERP_CATALOGUE_OWNER: ${EPCERP_CATALOGUE_OWNER:-nextjs}
      EPCERP_VENDOR_PROFILES_OWNER: ${EPCERP_VENDOR_PROFILES_OWNER:-nextjs}
      EPCERP_VENDOR_DOCUMENTS_OWNER: ${EPCERP_VENDOR_DOCUMENTS_OWNER:-nextjs}
      EPCERP_VENDOR_VERIFICATION_OWNER: ${EPCERP_VENDOR_VERIFICATION_OWNER:-nextjs}
      EPCERP_DATABASE_URL: postgresql://epcerp:${EPCERP_DB_PASSWORD:?Run setup.sh first}@db:5432/epcerp
      VTPL_DOCUMENT_ENCRYPTION_KEY: ${VTPL_DOCUMENT_ENCRYPTION_KEY:-}
      VTPL_JWT_SECRET_KEY: ${EPCERP_JWT_SECRET:?Run setup.sh first}
      VTPL_JWT_ISSUER: epcERP
      VTPL_JWT_AUDIENCE: epcERP-api
      VTPL_BOOTSTRAP_SUPERADMIN_USERNAME: superadmin
      VTPL_BOOTSTRAP_SUPERADMIN_EMAIL: admin@epcerp.local
      VTPL_BOOTSTRAP_SUPERADMIN_PASSWORD: ${EPCERP_ADMIN_PASSWORD:?Run setup.sh first}
      EPCERP_SUPPLIER_DOCUMENT_KEY: ${EPCERP_SUPPLIER_DOCUMENT_KEY:?Run setup.sh first}
      VTPL_STORAGE_ENDPOINT: storage:9000
      VTPL_STORAGE_ACCESS_KEY: epcerp_storage
      VTPL_STORAGE_SECRET_KEY: ${EPCERP_STORAGE_SECRET:?Run setup.sh first}
      VTPL_STORAGE_BUCKET: epcerp-documents
      VTPL_STORAGE_SECURE: "false"
      EPCERP_IMAGE_ENCRYPTION_KEY: ${EPCERP_IMAGE_ENCRYPTION_KEY:?Run setup.sh first}
      EPCERP_EMAIL_DELIVERY_ENABLED: ${EPCERP_EMAIL_DELIVERY_ENABLED:-false}
      EPCERP_BREVO_API_KEY: ${EPCERP_BREVO_API_KEY:-}
      EPCERP_EMAIL_SENDER_EMAIL: ${EPCERP_EMAIL_SENDER_EMAIL:-${EPCERP_RECOVERY_SENDER_EMAIL:-}}
      EPCERP_EMAIL_SENDER_NAME: ${EPCERP_EMAIL_SENDER_NAME:-${EPCERP_RECOVERY_SENDER_NAME:-}}
      EPCERP_PUBLIC_URL: ${EPCERP_PUBLIC_URL:-https://erp.vishaltechnopower.in}
    ports:
      - "127.0.0.1:9092:3000"
    depends_on:
      schema:
        condition: service_completed_successfully
      document-processor:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login?session=expired').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  clamav_signatures:
  document_packages_data:
  postgres_data:
  storage_data:

networks:
  reading_internal:
    internal: true
