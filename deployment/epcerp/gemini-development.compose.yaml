# Apply only to the development release, with its original .env plus a private
# .env.gemini file. Never run `compose config` without --quiet: it expands secrets.
# Approval is explicit per deployment in its private environment file. The user
# approved the public Gemini API for this Mac's preview on 2 November 2026.
# This does not establish India-only processing or approve another deployment.
# Cloud calls remain explicit user actions; local extraction/search stay available.
services:
  api:
    environment:
      EPCERP_TSC_CLOUD_APPROVED: ${EPCERP_TSC_CLOUD_APPROVED:-false}
      EPCERP_TSC_GEMINI_API_KEY: ${EPCERP_TSC_GEMINI_API_KEY:?Supply the private Gemini environment file}
      EPCERP_TSC_OPENAI_API_KEY: ""
  tsc-worker:
    environment:
      EPCERP_TSC_CLOUD_APPROVED: ${EPCERP_TSC_CLOUD_APPROVED:-false}
      EPCERP_TSC_GEMINI_API_KEY: ${EPCERP_TSC_GEMINI_API_KEY:?Supply the private Gemini environment file}
      EPCERP_TSC_OPENAI_API_KEY: ""
