# Apply only to the development release, with its original .env plus a private
# .env.gemini file. Never run `compose config` without --quiet: it expands secrets.
# Each deployment needs explicit user approval in its private environment file.
# Public Gemini processing does not establish India-only data residency.
# Cloud calls remain explicit user actions; local extraction/search stay available.
services:
  api:
    networks: [default, reading_internal, cloud_outbound]
    environment:
      EPCERP_TSC_CLOUD_APPROVED: ${EPCERP_TSC_CLOUD_APPROVED:-false}
      EPCERP_TSC_GEMINI_API_KEY: ${EPCERP_TSC_GEMINI_API_KEY:?Supply the private Gemini environment file}
      EPCERP_TSC_OPENAI_API_KEY: ""
  tsc-worker:
    networks: [default, reading_internal, cloud_outbound]
    environment:
      EPCERP_TSC_CLOUD_APPROVED: ${EPCERP_TSC_CLOUD_APPROVED:-false}
      EPCERP_TSC_GEMINI_API_KEY: ${EPCERP_TSC_GEMINI_API_KEY:?Supply the private Gemini environment file}
      EPCERP_TSC_OPENAI_API_KEY: ""
# Image-only releases keep their existing data/reader networks internal. Only
# the API and TSC worker need outbound HTTPS; no host ports are added.
networks:
  cloud_outbound:
    internal: false
